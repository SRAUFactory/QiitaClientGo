name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@304758201b33364f7b6070a256a4823a07804968 # v5.5.0
        with:
          go-version: '1.26'

      - name: Run unit tests
        run: go test -v -race ./...
